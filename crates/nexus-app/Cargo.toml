[package]
name = "nexus-app"
description = "Elite Nexus desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "EliteNexus"
path = "src/main.rs"

[dependencies]
nexus-journal.workspace = true
nexus-data.workspace = true
nexus-model.workspace = true
nexus-binds.workspace = true
nexus-hud.workspace = true
nexus-spansh.workspace = true
nexus-uplink.workspace = true
nexus-galaxy.workspace = true
nexus-eddn.workspace = true
nexus-ai.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_plot.workspace = true
egui-phosphor.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
arboard.workspace = true
flate2.workspace = true
base64.workspace = true
image.workspace = true
rustc-hash.workspace = true
tokio.workspace = true
reqwest.workspace = true
# Folder pickers. Linux: the desktop's file-chooser portal, with libdbus loaded at run time (zenity if there's no
# portal), so the binary links no system library for it. macOS: the system's open panel (AppKit).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[target.'cfg(windows)'.dependencies]
# Linux speaks through speech-dispatcher's spd-say instead (src/tts.rs): no system library to link.
tts.workspace = true
# Gdi and Threading: the overlay finds the game's monitor and its own window.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The overlay asks X11 which window is in front. libX11 is loaded at run time (as winit does), so the binary links
# no system library for it.
x11-dl = "2.21"

[build-dependencies]
embed-resource = "3"
