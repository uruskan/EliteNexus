name: CI

# A push or pull request that changes only the website or documents the app doesn't compile skips the build. The
# README (the support card's thanks), docs/USER_GUIDE.md (Ask's knowledge) and data/ are compiled in, so changes to
# them still run it. The website has its own check (pages.yml). Keep the two lists the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/ARCHITECTURE.md"
      - "docs/DESIGN.md"
      - "docs/research/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"
  pull_request:
    paths-ignore:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/pages.yml"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/ARCHITECTURE.md"
      - "docs/DESIGN.md"
      - "docs/research/**"
      - "docs/screenshots/**"
      - "docs/social-preview.png"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  linux:
    # The same checks on Linux, where the game runs under Proton.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  macos:
    # The same checks on macOS, where the game runs under NotProton, CrossOver or Whisky.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
